  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#dbeafe"/><stop offset="1" stop-color="#a5b4fc"/></linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffffff" stop-opacity=".94"/><stop offset="1" stop-color="#eff6ff" stop-opacity=".86"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <circle cx="1390" cy="120" r="310" fill="#38bdf8" opacity=".22"/><circle cx="180" cy="840" r="340" fill="#6366f1" opacity=".18"/>
  <text x="90" y="100" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="32" font-weight="700">BOXES · DEMO SCREEN 01</text>
