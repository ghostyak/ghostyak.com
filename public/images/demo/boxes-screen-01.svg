    <text x="145" y="225" fill="#1e3a8a" font-family="Arial, sans-serif" font-size="34" font-weight="700">PROJECT</text>
    <g fill="#2563eb"><rect x="145" y="275" width="116" height="92" rx="18"/><rect x="290" y="275" width="116" height="92" rx="18"/><rect x="435" y="275" width="116" height="92" rx="18"/><rect x="580" y="275" width="116" height="92" rx="18"/></g>
    <g fill="#93c5fd"><rect x="145" y="414" width="250" height="34" rx="10"/><rect x="145" y="470" width="500" height="22" rx="8"/><rect x="145" y="512" width="430" height="22" rx="8"/><rect x="145" y="554" width="475" height="22" rx="8"/></g>
    <rect x="145" y="630" width="210" height="50" rx="16" fill="#1d4ed8"/>
